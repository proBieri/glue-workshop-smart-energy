<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gPlug Emulator</title>
<style>
:root{--bg:#1b1d21;--panel:#25282e;--line:#3a3e46;--txt:#e6e6e6;--mut:#9aa0a8;--acc:#1fa3ec;--ok:#43a047;--err:#e53935;--warn:#fb8c00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0}
#uhr{font:600 20px ui-monospace,Menlo,monospace}
.pill{padding:2px 8px;border-radius:10px;background:var(--panel);color:var(--mut);font-size:12px}
.pill.ok{color:var(--ok)}.pill.err{color:var(--err)}
main{display:grid;grid-template-columns:430px 1fr;gap:12px;padding:12px}
@media(max-width:900px){main{grid-template-columns:1fr}}
iframe{width:100%;height:calc(100vh - 90px);min-height:560px;border:1px solid var(--line);border-radius:8px;background:#252525}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
section h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:#33373f;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.prim{background:var(--acc);border-color:var(--acc);color:#fff}
input,select{background:#1b1d21;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
#log{height:300px;overflow:auto;background:#111316;border-radius:6px;padding:6px 8px;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#log .e{color:#ff8a80}#log .w{color:#ffcc80}#log .c{color:#80d8ff}
table{border-collapse:collapse;width:100%;font-size:13px}td{padding:2px 6px 2px 0;vertical-align:top}td:first-child{color:var(--mut);white-space:nowrap}
code{font:12px ui-monospace,Menlo,monospace}
textarea{width:100%;height:110px;background:#111316;color:var(--txt);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,Menlo,monospace;padding:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1200px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>gPlug Emulator</h1>
  <span id="uhr">--:--:--</span>
  <span id="datum" class="pill"></span>
  <span id="app" class="pill"></span>
  <span id="bkw" class="pill"></span>
  <span class="row" style="margin-left:auto">
    <button class="prim" onclick="post('build').then(function(){setTimeout(neu,2500);})" title="./build.sh ausführen und App neu laden">Neu bauen &amp; laden</button>
    <button onclick="post('restart').then(neu)" title="wie 'Restart 1' auf dem Gerät: Dateisystem bleibt">Neustart</button>
    <button onclick="if(confirm('Dateisystem leeren und Uhr auf Echtzeit setzen?'))post('reset').then(neu)">Zurücksetzen</button>
  </span>
</header>
<main>
  <iframe id="tas" src="/" title="Tasmota-Hauptseite"></iframe>
  <div class="col">
    <section>
      <h2>Zeit</h2>
      <div class="row" id="speed">
        <button data-s="0">Pause</button><button data-s="1">1×</button><button data-s="60">60×</button>
        <button data-s="600">600×</button><button data-s="3600">3600×</button>
        <span style="width:12px"></span>
        <button onclick="vor(3600)">+1 h</button><button onclick="vor(6*3600)">+6 h</button><button onclick="vor(86400)">+1 Tag</button>
        <button onclick="bis(18,6)">bis 18:06</button><button onclick="bis(0,2)">bis 00:02</button>
      </div>
      <p style="color:var(--mut);margin:8px 0 0;font-size:12px">Zeitraffer läuft Cron und Timer exakt durch. Weicht die Uhr von der Echtzeit ab, liefert die BKW-API Fixture-Daten (Modus <i>auto</i>).</p>
    </section>
    <div class="grid2">
      <section>
        <h2>Smart Meter (simuliert)</h2>
        <table>
          <tr><td>Einspeisung Eo</td><td id="eo"></td></tr>
          <tr><td>Bezug Ei</td><td id="ei"></td></tr>
          <tr><td>Leistung</td><td id="pw"></td></tr>
        </table>
        <div class="row" style="margin-top:6px">
          <label><input type="checkbox" id="men" onchange="post('meter',{enabled:this.checked})"> liefert Daten</label>
          <label>PV-Spitze <select id="pv" onchange="post('meter',{pv_peak:+this.value})">
            <option>0</option><option>3000</option><option>6000</option><option>10000</option></select> W</label>
        </div>
      </section>
      <section>
        <h2>BKW-API</h2>
        <div class="row">
          <select id="bkwm" onchange="post('bkw',{mode:this.value})">
            <option value="auto">auto</option><option value="live">live (echte API)</option>
            <option value="fixture">fixture (simuliert)</option><option value="error">error (Netzwerkfehler)</option>
          </select>
          <span id="fc" class="pill"></span>
        </div>
        <table style="margin-top:6px"><tr><td>Heap (Desktop)</td><td id="heap"></td></tr></table>
      </section>
    </div>
    <section>
      <h2>Konsole</h2>
      <form class="row" onsubmit="cmd();return false">
        <input id="cmd" style="flex:1;min-width:200px" placeholder="z.B. GplugInfo · Status 10 · Br tasmota.memory()" autocomplete="off">
        <button class="prim">Senden</button>
      </form>
      <div id="log" style="margin-top:8px"></div>
    </section>
    <div class="grid2">
      <section>
        <h2>App</h2>
        <table id="appinfo"></table>
      </section>
      <section>
        <h2>Dateisystem</h2>
        <table id="files"></table>
        <details style="margin-top:6px"><summary>/gplug.json bearbeiten</summary>
          <textarea id="cfg">{"key_ein": "Eo", "key_bez": "Ei", "csv_monate": 3}</textarea>
          <button onclick="cfg()">Speichern (wirkt nach Neustart)</button>
        </details>
      </section>
    </div>
  </div>
</main>
<script>
var seit=0,st={},hist=[],hpos=0,upt=null;
function $(i){return document.getElementById(i);}
function post(a,b){return fetch('/emu/api/'+a,{method:'POST',body:JSON.stringify(b||{})}).then(function(r){return r.json();});}
function neu(){$('tas').src='/';status();}
function p2(n){return(n<10?'0':'')+n;}
function zeit(loc){var d=new Date(loc*1000);return [d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()),p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds())];}
function vor(s){post('advance',{s:s}).then(status);}
function bis(h,m){var loc=st.local||0,z=Math.floor(loc/86400)*86400+h*3600+m*60;if(z<=loc)z+=86400;vor(z-loc);}
function kwh(wh){return (wh/1000).toFixed(3)+' kWh';}
function status(){
  fetch('/emu/api/state').then(function(r){return r.json();}).then(function(s){
    /* uptime kleiner als beim letzten Abruf → App neu gestartet (build.sh, Neustart, …): Tasmota-Seite neu laden */
    if(upt!==null&&s.uptime<upt)$('tas').src='/';upt=s.uptime;
    st=s;var t=zeit(s.local);$('uhr').textContent=t[1];$('datum').textContent=t[0]+' (UTC'+(s.tz>=0?'+':'')+s.tz/60+')';
    $('app').textContent=s.app+(s.load_ok?' geladen':' FEHLER');$('app').className='pill '+(s.load_ok?'ok':'err');
    $('bkw').textContent='BKW: '+s.fetch_mode;
    [].forEach.call(document.querySelectorAll('#speed [data-s]'),function(b){b.className=(+b.dataset.s===s.speed)?'on':'';});
    if(s.meter){$('eo').textContent=kwh(s.meter.eo_wh);$('ei').textContent=kwh(s.meter.ei_wh);
      $('pw').textContent=s.meter.po>0?('Einspeisung '+s.meter.po+' W'):('Bezug '+s.meter.pi+' W');
      $('men').checked=s.meter.enabled;$('pv').value=s.meter.pv_peak;}
    $('bkwm').value=s.bkw_mode;$('fc').textContent=s.fetch_count+' Abrufe';
    $('heap').textContent=(s.heap/1024).toFixed(1)+' kB (Gerät: kleinere Zeiger, ~0.6×)';
    var c=(s.crons||[]).map(function(x){return '<code>'+x[0]+'</code> '+zeit(x[1])[1];}).join('<br>');
    $('appinfo').innerHTML='<tr><td>Quelle</td><td><code>'+s.src+'/</code></td></tr><tr><td>Treiber</td><td>'+s.drivers+'</td></tr>'+
      '<tr><td>Cron</td><td>'+(c||'–')+'</td></tr><tr><td>Timer</td><td>'+s.timers+'</td></tr>'+
      '<tr><td>Routen</td><td>'+((s.routes||[]).map(function(r){return '<a href="'+r+'" target="_blank" style="color:var(--acc)"><code>'+r+'</code></a>';}).join('<br>')||'–')+'</td></tr>'+
      '<tr><td>Befehle</td><td><code>'+((s.cmds||[]).join(' ')||'–')+'</code></td></tr>';
  }).catch(function(){});
  fetch('/emu/api/files').then(function(r){return r.json();}).then(function(f){
    $('files').innerHTML=f.map(function(x){return '<tr><td><a href="/emu/fs/'+encodeURIComponent(x.name)+'" target="_blank" style="color:var(--acc)">/'+x.name+'</a></td><td>'+x.size+' B</td></tr>';}).join('')||'<tr><td>leer</td></tr>';
  });
}
function logs(){
  fetch('/emu/api/log?seit='+seit).then(function(r){return r.json();}).then(function(l){
    if(!l.length)return;var el=$('log'),unten=el.scrollTop+el.clientHeight>=el.scrollHeight-20;
    l.forEach(function(x){seit=x.n;var d=document.createElement('div');d.textContent=x.t;
      if(/BRY|FEHLER|Exception|failed|ERR/.test(x.t))d.className='e';else if(/^EMU/.test(x.t))d.className='w';else if(/^CMD/.test(x.t))d.className='c';el.appendChild(d);});
    while(el.childNodes.length>1500)el.removeChild(el.firstChild);
    if(unten)el.scrollTop=el.scrollHeight;});
}
function cmd(){var v=$('cmd').value.trim();if(!v)return;hist.push(v);hpos=hist.length;$('cmd').value='';post('cmd',{line:v}).then(status);}
$('cmd').addEventListener('keydown',function(e){if(e.key==='ArrowUp'&&hpos>0){$('cmd').value=hist[--hpos];e.preventDefault();}if(e.key==='ArrowDown'&&hpos<hist.length){hpos++;$('cmd').value=hist[hpos]||'';}});
[].forEach.call(document.querySelectorAll('#speed [data-s]'),function(b){b.onclick=function(){post('speed',{speed:+b.dataset.s}).then(status);};});
function cfg(){fetch('/emu/fs/gplug.json',{method:'POST',body:$('cfg').value}).then(status);}
fetch('/emu/fs/gplug.json').then(function(r){return r.ok?r.text():null;}).then(function(t){if(t)$('cfg').value=t;});
status();logs();setInterval(status,1000);setInterval(logs,1000);
</script>
</body>
</html>
